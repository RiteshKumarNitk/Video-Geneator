services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: chroma
      POSTGRES_USER: chroma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chroma}
    volumes:
      - clips_database:/var/lib/postgresql/data
      - ./next-app/prisma/migrations/202611190001_clips/migration.sql:/docker-entrypoint-initdb.d/001-clips.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chroma -d chroma"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - videobg_network

  redis:
    image: redis:7-alpine
    container_name: videobg_redis
    restart: always
    networks:
      - videobg_network

  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: videobg_python_ai
    restart: always
    environment:
      - PORT=8000
      - YOUTUBE_COOKIES_FILE=/app/cookies/youtube.txt
      - YOUTUBE_AI_CLIPS=true
    volumes:
      - shared_storage:/app/shared-storage
      - ./python-ai/cookies:/app/cookies:ro
    expose:
      - "8000"
    networks:
      - videobg_network

  nextjs:
    build:
      context: ./next-app
      dockerfile: Dockerfile
    container_name: videobg_nextjs
    restart: always
    environment:
      - PYTHON_AI_URL=http://python-ai:8000
      - DATABASE_URL=postgres://chroma:${POSTGRES_PASSWORD:-chroma}@postgres:5432/chroma
      - REDIS_URL=redis://redis:6379
      - NEXTJS_INTERNAL_URL=http://nextjs:3000
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_TOKEN_KEY=${YOUTUBE_TOKEN_KEY:-}
      - NODE_ENV=production
      - PORT=3000
      - SHARED_STORAGE_PATH=/app/shared-storage
    volumes:
      - shared_storage:/app/shared-storage
    ports:
      - "3000:3000"
    depends_on:
      python-ai:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - videobg_network

  nginx:
    image: nginx:alpine
    container_name: videobg_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_storage:/app/shared-storage:ro
    depends_on:
      - nextjs
      - python-ai
    networks:
      - videobg_network

volumes:
  clips_database:
  shared_storage:

networks:
  videobg_network:
    driver: bridge
